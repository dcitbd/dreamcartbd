<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Embedded SVG Favicon (No 404) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <title>Dream Cart BD — Smart Digital Commerce Platform</title>

  <!-- Global Environment API Config -->
  <script>
    window.VITE_API_ENDPOINT = "https://script.google.com/macros/s/AKfycbyuyANFCLHnE-GGbGnx_1yr2Z_BOPWv-qBqh-1zQg4knzmMXnL15ERsbeOCfBNBZwys/exec";
    window.VITE_SPREADSHEET_ID = "19tz5stOSkfR0pLbRRVBIbM-qdOMbUTk0QD8Xf4Of1Pc";
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#bae0fd', 300: '#7cc7fb', 400: '#36abf7',
              500: '#0c8fe9', 600: '#0272c7', 700: '#035ba1', 800: '#074d85', 900: '#0b416e',
            },
            luxury: { dark: '#0b0f19', navy: '#0f172a', card: '#1e293b', accent: '#d97706', gold: '#f59e0b', emerald: '#10b981', rose: '#f43f5e' }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', '"Hind Siliguri"', 'sans-serif'], bengali: ['"Hind Siliguri"', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Standalone Styles -->
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-luxury-dark dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">
  
  <!-- Root SPA Mounting Point -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Initial Loading Screen -->
    <div id="global-loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white dark:bg-luxury-dark transition-opacity duration-300">
      <div class="relative w-14 h-14">
        <div class="absolute inset-0 rounded-full border-4 border-slate-200 dark:border-slate-800"></div>
        <div class="absolute inset-0 rounded-full border-4 border-brand-500 border-t-transparent animate-spin"></div>
      </div>
      <p class="mt-4 text-xs font-semibold tracking-wider text-slate-500 font-bengali">লোড হচ্ছে...</p>
    </div>
  </div>

  <!-- Cart Drawer Root Mounting Point -->
  <div id="cart-drawer-root"></div>

  <!-- Global Modal Root -->
  <div id="modal-root" class="relative z-50"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <!-- Bootstrapper with Forced Cache-Busting & Safety Fallback -->
  <script type="module">
    // ৩ সেকেন্ডের মধ্যে লোড না হলে জোরপূর্বক লোডার সরিয়ে ফেলার সেফটি টাইমার
    const safetyTimer = setTimeout(() => {
      const loader = document.getElementById("global-loader");
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    }, 3000);

    import(`./src/main.js?v=${Date.now()}`)
      .then(() => {
        clearTimeout(safetyTimer);
        console.log('✅ Dream Cart BD Live Engine Connected.');
        const loader = document.getElementById("global-loader");
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      })
      .catch((err) => {
        clearTimeout(safetyTimer);
        console.error('App Load Error:', err);
        const loader = document.getElementById("global-loader");
        if (loader) loader.remove();
      });
  </script>
</body>
</html>
