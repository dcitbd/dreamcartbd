<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dream Cart BD — Smart Digital Commerce & Multi-Vendor Platform</title>
  
  <meta name="description" content="Bangladesh's premier high-reliability smart commerce platform: Smartwatches, organic health supplements, tactical lighting, and kitchen safety gas accessories." />
  <meta property="og:title" content="Dream Cart BD — Smart Digital Commerce" />
  <meta property="og:description" content="Multi-Vendor E-Commerce Platform powered by Google Sheets & Google Apps Script API Gateway." />
  <meta property="og:type" content="website" />
  
  <!-- Dynamic Base Path Adjustment for GitHub Pages Sub-directories -->
  <script>
    (function() {
      if (window.location.hostname.includes('github.io')) {
        var segments = window.location.pathname.split('/').filter(Boolean);
        var knownRoutes = [
          'products', 'shop', 'product', 'cart', 'favourite', 'wishlist',
          'checkout', 'order', 'order-success', 'track', 'tracking', 'contact', 'offers',
          'categories', 'brands', 'others-market', 'chat', 'live-chat',
          'landing', 'terms', 'privacy', 'customer', 'reseller', 'wholesaler', 'admin'
        ];
        if (segments.length > 0 && !knownRoutes.includes(segments[0].toLowerCase())) {
          var baseTag = document.querySelector('base');
          if (baseTag) baseTag.href = '/' + segments[0] + '/';
          window.__APP_BASE__ = '/' + segments[0];
          return;
        }
      }
      window.__APP_BASE__ = '';
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
