<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Dream Cart BD</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      sessionStorage.setItem('dcbd_spa_redirect', path + search + hash);
      
      var segments = path.split('/').filter(Boolean);
      var root = '/';
      if (window.location.hostname.includes('github.io') && segments.length > 0) {
        var known = ['products', 'shop', 'product', 'cart', 'favourite', 'wishlist', 'checkout', 'order', 'order-success', 'track', 'tracking', 'contact', 'offers', 'categories', 'brands', 'others-market', 'chat', 'live-chat', 'landing', 'terms', 'privacy', 'customer', 'reseller', 'wholesaler', 'admin', 'login', 'register'];
        if (!known.includes(segments[0].toLowerCase())) {
          root = '/' + segments[0] + '/';
        }
      }
      window.location.replace(root);
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a;">
  <style>
    @keyframes dcbdSpin404 { to { transform: rotate(360deg); } }
  </style>
  <div style="position: relative; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
    <div style="position: absolute; inset: 0; border-radius: 18px; border: 3px solid rgba(16,185,129,0.25); border-top-color: #059669; animation: dcbdSpin404 1s linear infinite;"></div>
    <div style="width: 56px; height: 56px; border-radius: 14px; background: #ffffff; padding: 4px; box-shadow: 0 8px 20px rgba(5,150,105,0.2); border: 1.5px solid #10b981; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <img src="https://pictures-bangladesh.jijistatic.com/2033199_MjAwLTIwMC03Nzk0Y2Y2Yzkx.jpg" alt="Dream Cart BD Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 10px;" onerror="this.onerror=null; this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10';" />
    </div>
  </div>
  <h3 style="font-size: 16px; margin: 0 0 6px 0; font-weight: 800;">Dream Cart BD</h3>
  <p style="font-size: 13px; color: #64748b; margin: 0;">পৃষ্ঠাটি লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
</body>
</html>
