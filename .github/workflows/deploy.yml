name: Deploy Dream Cart BD to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run build
          # Copy clean URL routing and hosting files into dist
          cp 404.html dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true
          cp _redirects dist/ 2>/dev/null || true
          cp _routes.json dist/ 2>/dev/null || true
          cp -r products shop cart checkout order-success track favourite wishlist categories brands others-market chat live-chat landing terms privacy customer reseller wholesaler admin dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
