name: Deploy Dream Cart BD to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npm run build
          # Ensure all routes, assets, CNAME and fallback files are in dist
          cp CNAME dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true
          cp _redirects dist/ 2>/dev/null || true
          cp _routes.json dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
          cp -r public/* dist/ 2>/dev/null || true
          cp -r products product shop cart checkout order order-success track tracking favourite wishlist categories brands others-market chat live-chat landing terms privacy customer reseller wholesaler admin login register dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
